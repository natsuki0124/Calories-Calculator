<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="卡路里計算機" />
  <title>智慧卡路里計算機 PWA</title>
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f3f4f6;
      padding-bottom: 170px; /* 預留底部結算卡片空間 */
      -webkit-tap-highlight-color: transparent;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body class="text-gray-800 max-w-md mx-auto min-h-screen relative">

  <!-- 頂部標題列 -->
  <header class="bg-emerald-600 text-white px-4 py-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold tracking-wide">🥗 智慧卡路里計算機</h1>
      <p class="text-xs text-emerald-100" id="todayDate"></p>
    </div>
    <div class="flex gap-2">
      <button id="installBtn" class="hidden bg-white text-emerald-700 text-xs font-semibold px-3 py-1.5 rounded-full shadow active:scale-95 transition">
        📲 安裝 App
      </button>
      <button onclick="resetToday()" class="bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-1.5 rounded-full transition">
        重置今日
      </button>
    </div>
  </header>

  <main class="p-4 space-y-4">

    <!-- 1. 三餐建議卡路里設定區 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-gray-700 flex items-center gap-1.5">
          <span>🎯</span> 三餐建議卡路里
        </h2>
        <span class="text-xs font-medium text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">
          建議總計：<strong id="targetTotalDisplay">1800</strong> kcal
        </span>
      </div>

      <div class="space-y-3">
        <!-- 早餐 -->
        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl">
          <span class="font-medium text-gray-700 pl-1">🌅 早餐建議</span>
          <div class="flex items-center gap-2">
            <button onclick="adjustMeal('breakfast', -50)" class="w-9 h-9 rounded-lg bg-white border border-gray-200 text-lg font-bold text-gray-600 active:bg-gray-100 shadow-sm">−</button>
            <input type="number" id="breakfastInput" value="500" onchange="manualMealChange('breakfast', this.value)" class="w-16 text-center font-bold text-gray-800 bg-transparent focus:outline-none focus:bg-white rounded" />
            <button onclick="adjustMeal('breakfast', 50)" class="w-9 h-9 rounded-lg bg-white border border-gray-200 text-lg font-bold text-emerald-600 active:bg-gray-100 shadow-sm">+</button>
          </div>
        </div>

        <!-- 午餐 -->
        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl">
          <span class="font-medium text-gray-700 pl-1">☀️ 午餐建議</span>
          <div class="flex items-center gap-2">
            <button onclick="adjustMeal('lunch', -50)" class="w-9 h-9 rounded-lg bg-white border border-gray-200 text-lg font-bold text-gray-600 active:bg-gray-100 shadow-sm">−</button>
            <input type="number" id="lunchInput" value="700" onchange="manualMealChange('lunch', this.value)" class="w-16 text-center font-bold text-gray-800 bg-transparent focus:outline-none focus:bg-white rounded" />
            <button onclick="adjustMeal('lunch', 50)" class="w-9 h-9 rounded-lg bg-white border border-gray-200 text-lg font-bold text-emerald-600 active:bg-gray-100 shadow-sm">+</button>
          </div>
        </div>

        <!-- 晚餐 -->
        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl">
          <span class="font-medium text-gray-700 pl-1">🌙 晚餐建議</span>
          <div class="flex items-center gap-2">
            <button onclick="adjustMeal('dinner', -50)" class="w-9 h-9 rounded-lg bg-white border border-gray-200 text-lg font-bold text-gray-600 active:bg-gray-100 shadow-sm">−</button>
            <input type="number" id="dinnerInput" value="600" onchange="manualMealChange('dinner', this.value)" class="w-16 text-center font-bold text-gray-800 bg-transparent focus:outline-none focus:bg-white rounded" />
            <button onclick="adjustMeal('dinner', 50)" class="w-9 h-9 rounded-lg bg-white border border-gray-200 text-lg font-bold text-emerald-600 active:bg-gray-100 shadow-sm">+</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. 飲食記錄與 AI 辨識區 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-gray-700 flex items-center gap-1.5">
          <span>🍽️</span> 剛吃了什麼？
        </h2>
        <span class="text-xs font-medium text-orange-600 bg-orange-50 px-2.5 py-1 rounded-full">
          已攝取：<strong id="foodTotalDisplay">0</strong> kcal
        </span>
      </div>

      <div class="space-y-2.5">
        <textarea id="foodText" rows="2" placeholder="輸入食物內容（例如：一碗牛肉麵和一杯無糖綠茶），或直接拍照上傳..." class="w-full p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-none"></textarea>

        <!-- 圖片預覽區 -->
        <div id="imagePreviewBox" class="hidden relative rounded-xl overflow-hidden border border-gray-200 bg-gray-50">
          <img id="imagePreview" src="" alt="食物預覽" class="w-full h-40 object-cover" />
          <button onclick="clearImage()" class="absolute top-2 right-2 bg-black/60 text-white text-xs px-2.5 py-1 rounded-full">
            ✕ 移除照片
          </button>
        </div>

        <div class="flex gap-2">
          <label class="flex-1 flex items-center justify-center gap-1.5 py-2.5 px-3 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl cursor-pointer transition active:scale-98">
            <span>📷 拍照 / 傳照片</span>
            <input type="file" id="foodImageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
          </label>
          <button id="analyzeFoodBtn" onclick="submitFood()" class="flex-1 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl shadow-sm transition active:scale-98 flex items-center justify-center gap-1">
            <span>✨ 計算食物熱量</span>
          </button>
        </div>
      </div>

      <!-- 今日飲食清單 -->
      <ul id="foodList" class="mt-3 divide-y divide-gray-100 text-sm"></ul>
    </section>

    <!-- 3. 運動消耗記錄區 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-gray-700 flex items-center gap-1.5">
          <span>🏃</span> 剛做了什麼運動？
        </h2>
        <span class="text-xs font-medium text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">
          已消耗：<strong id="exerciseTotalDisplay">0</strong> kcal
        </span>
      </div>

      <div class="flex gap-2">
        <input type="text" id="exerciseText" placeholder="例如：慢跑 30 分鐘、重訓 45 分鐘" class="flex-1 p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button id="analyzeExerciseBtn" onclick="submitExercise()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl shadow-sm transition active:scale-98 whitespace-nowrap">
          計算消耗
        </button>
      </div>

      <!-- 今日運動清單 -->
      <ul id="exerciseList" class="mt-3 divide-y divide-gray-100 text-sm"></ul>
    </section>

  </main>

  <!-- 4. 最底下：今日剩餘卡路里結算固定列 -->
  <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 shadow-[0_-4px_15px_rgba(0,0,0,0.06)] p-4 z-30 rounded-t-2xl">
    <div class="flex justify-between items-end mb-1.5">
      <div>
        <div class="text-[11px] text-gray-500 font-medium" id="formulaBreakdown">
          建議 1800 − 飲食 0 + 運動 0
        </div>
        <div class="text-sm font-bold text-gray-700">今日還可以攝取</div>
      </div>
      <div class="text-right">
        <span id="remainingCalories" class="text-3xl font-black text-emerald-600 tracking-tight">1800</span>
        <span class="text-xs font-bold text-gray-500 ml-0.5">kcal</span>
      </div>
    </div>

    <!-- 視覺化進度條 -->
    <div class="w-full h-2.5 bg-gray-100 rounded-full overflow-hidden">
      <div id="calorieProgressBar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 100%"></div>
    </div>
  </footer>

  <script>
    // ==========================================
    // 🔴 請將此網址替換為您的 Cloudflare Worker 網址
    // ==========================================
    const WORKER_URL = "https://calorie-api.natsuki3m.workers.dev";

    // 狀態管理
    const STORAGE_KEY = "calorie_pwa_data_v1";
    let state = {
      date: new Date().toLocaleDateString("zh-TW"),
      meals: { breakfast: 500, lunch: 700, dinner: 600 },
      foods: [],
      exercises: []
    };

    let currentImageBase64 = null;
    let currentImageMime = "image/jpeg";

    // 初始化載入
    function init() {
      document.getElementById("todayDate").textContent = state.date;
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        // 若跨天則保留三餐建議設定，清空當日飲食與運動
        if (parsed.date === state.date) {
          state = parsed;
        } else {
          state.meals = parsed.meals || state.meals;
          saveState();
        }
      }
      renderAll();
      registerSW();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // 三餐建議卡路里調整
    function adjustMeal(meal, delta) {
      state.meals[meal] = Math.max(0, (Number(state.meals[meal]) || 0) + delta);
      saveState();
      renderAll();
    }

    function manualMealChange(meal, val) {
      state.meals[meal] = Math.max(0, parseInt(val, 10) || 0);
      saveState();
      renderAll();
    }

    // 圖片壓縮與轉 Base64（避免手機拍照檔案過大）
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
          currentImageBase64 = dataUrl.split(",")[1];
          currentImageMime = "image/jpeg";

          document.getElementById("imagePreview").src = dataUrl;
          document.getElementById("imagePreviewBox").classList.remove("hidden");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      currentImageBase64 = null;
      document.getElementById("foodImageInput").value = "";
      document.getElementById("imagePreviewBox").classList.add("hidden");
    }

    // 呼叫 Cloudflare Worker 分析飲食
    async function submitFood() {
      const text = document.getElementById("foodText").value.trim();
      if (!text && !currentImageBase64) {
        alert("請輸入食物描述或上傳食物照片！");
        return;
      }

      const btn = document.getElementById("analyzeFoodBtn");
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "⏳ AI 估算中...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: "food",
            text,
            imageBase64: currentImageBase64,
            mimeType: currentImageMime
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "分析失敗");

        state.foods.push({
          id: Date.now(),
          name: data.name || text || "食物照片",
          calories: Math.round(Number(data.calories) || 0),
          detail: data.detail || ""
        });

        document.getElementById("foodText").value = "";
        clearImage();
        saveState();
        renderAll();
      } catch (err) {
        alert("計算失敗：" + err.message + "\n請確認 WORKER_URL 與 Cloudflare API Key 是否設定正確。");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    // 呼叫 Cloudflare Worker 分析運動
    async function submitExercise() {
      const text = document.getElementById("exerciseText").value.trim();
      if (!text) {
        alert("請輸入運動項目與時間！");
        return;
      }

      const btn = document.getElementById("analyzeExerciseBtn");
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "估算中...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: "exercise",
            text
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "分析失敗");

        state.exercises.push({
          id: Date.now(),
          name: data.name || text,
          calories: Math.round(Number(data.calories) || 0),
          detail: data.detail || ""
        });

        document.getElementById("exerciseText").value = "";
        saveState();
        renderAll();
      } catch (err) {
        alert("計算失敗：" + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    function removeFood(id) {
      state.foods = state.foods.filter(item => item.id !== id);
      saveState();
      renderAll();
    }

    function removeExercise(id) {
      state.exercises = state.exercises.filter(item => item.id !== id);
      saveState();
      renderAll();
    }

    function resetToday() {
      if (!confirm("確定要清空今日所有的飲食與運動紀錄嗎？")) return;
      state.foods = [];
      state.exercises = [];
      saveState();
      renderAll();
    }

    // 更新畫面與底部核心計算公式
    function renderAll() {
      document.getElementById("breakfastInput").value = state.meals.breakfast;
      document.getElementById("lunchInput").value = state.meals.lunch;
      document.getElementById("dinnerInput").value = state.meals.dinner;

      const targetTotal = state.meals.breakfast + state.meals.lunch + state.meals.dinner;
      const foodTotal = state.foods.reduce((sum, item) => sum + item.calories, 0);
      const exerciseTotal = state.exercises.reduce((sum, item) => sum + item.calories, 0);

      // 核心公式：三餐建議總和 - 所吃食物 + 所做運動
      const remaining = targetTotal - foodTotal + exerciseTotal;

      document.getElementById("targetTotalDisplay").textContent = targetTotal;
      document.getElementById("foodTotalDisplay").textContent = foodTotal;
      document.getElementById("exerciseTotalDisplay").textContent = exerciseTotal;

      document.getElementById("formulaBreakdown").textContent =
        `建議 ${targetTotal} − 飲食 ${foodTotal} + 運動 ${exerciseTotal}`;

      const remainingEl = document.getElementById("remainingCalories");
      const barEl = document.getElementById("calorieProgressBar");
      remainingEl.textContent = remaining;

      const ratio = targetTotal > 0 ? Math.max(0, Math.min(100, (remaining / targetTotal) * 100)) : 0;
      barEl.style.width = `${ratio}%`;

      if (remaining < 0) {
        remainingEl.className = "text-3xl font-black text-red-600 tracking-tight";
        barEl.className = "h-full bg-red-500 transition-all duration-300";
      } else if (remaining < targetTotal * 0.25) {
        remainingEl.className = "text-3xl font-black text-amber-500 tracking-tight";
        barEl.className = "h-full bg-amber-500 transition-all duration-300";
      } else {
        remainingEl.className = "text-3xl font-black text-emerald-600 tracking-tight";
        barEl.className = "h-full bg-emerald-500 transition-all duration-300";
      }

      // 渲染飲食清單
      const foodListEl = document.getElementById("foodList");
      foodListEl.innerHTML = state.foods.map(item => `
        <li class="py-2.5 flex justify-between items-center gap-2">
          <div>
            <div class="font-medium text-gray-800">${escapeHtml(item.name)}</div>
            ${item.detail ? `<div class="text-xs text-gray-400">${escapeHtml(item.detail)}</div>` : ""}
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="font-bold text-orange-600">-${item.calories} kcal</span>
            <button onclick="removeFood(${item.id})" class="text-gray-400 hover:text-red-500 px-1.5 py-0.5">✕</button>
          </div>
        </li>
      `).join("");

      // 渲染運動清單
      const exerciseListEl = document.getElementById("exerciseList");
      exerciseListEl.innerHTML = state.exercises.map(item => `
        <li class="py-2.5 flex justify-between items-center gap-2">
          <div>
            <div class="font-medium text-gray-800">${escapeHtml(item.name)}</div>
            ${item.detail ? `<div class="text-xs text-gray-400">${escapeHtml(item.detail)}</div>` : ""}
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="font-bold text-blue-600">+${item.calories} kcal</span>
            <button onclick="removeExercise(${item.id})" class="text-gray-400 hover:text-red-500 px-1.5 py-0.5">✕</button>
          </div>
        </li>
      `).join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 註冊 PWA Service Worker 與安裝提示
    let deferredPrompt;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById("installBtn");
      installBtn.classList.remove("hidden");
      installBtn.onclick = async () => {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        installBtn.classList.add("hidden");
        deferredPrompt = null;
      };
    });

    function registerSW() {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW 註冊略過:", err));
      }
    }

    init();
  </script>
</body>
</html>
